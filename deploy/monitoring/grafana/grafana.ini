; Grafana стенда на machine-4 (deploy/monitoring/install.sh). Только 127.0.0.1, интернета у
; машины нет, поэтому все обращения Grafana наружу выключены. Источник данных и дашборд
; задаются файлами в /etc/grafana/provisioning, правки в интерфейсе не сохраняются.

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
; С Grafana 13.2 источник Prometheus это отдельный плагин в папке plugins-bundled архива.
; Без интернета от этой папки зависит, будет ли он вообще. Путь подставляет install.sh.
bundled_plugins = @BUNDLED_PLUGINS@

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1
; адрес на Маке после проброса порта (README): по нему Grafana строит ссылки и переходы
root_url = http://127.0.0.1:13000/

[database]
type = sqlite3

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
; пароль генерирует install.sh при первой установке, файл только для root и группы grafana
admin_password = $__file{/etc/grafana/admin-password}
disable_gravatar = true
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false

; Смотреть дашборд можно без входа, только на чтение: Grafana видна лишь через проброс на Мак
; (так же устроена панель стенда). Менять что-либо может только admin.
[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/stand.json

[snapshots]
external_enabled = false

[news]
news_feed_enabled = false

[plugins]
; не обновлять плагины из каталога grafana.com на старте (с 13.2 так обновляется и Prometheus)
preinstall_auto_update = false
; ключ проверки подписей плагинов встроен в Grafana, за ним не ходим
public_key_retrieval_disabled = true
plugin_admin_enabled = false

[public_dashboards]
enabled = false

[unified_alerting]
enabled = false

[log]
mode = console file
level = info
