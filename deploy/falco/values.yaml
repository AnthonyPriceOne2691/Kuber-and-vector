# Falco на стенде (чарт falco 9.2.2, Falco 0.45.2): сторож для сцены «заражённый под».
# Работает без интернета: образ из комплекта (pullPolicy Never); модуль modern eBPF встроен
# в программу; стандартные правила и плагин container лежат в образе, поэтому falcoctl
# (качает правила и плагины при старте) выключен. Плагин container берёт имена подов
# и пространств имён из containerd k3s.
image:
  registry: docker.io
  repository: falcosecurity/falco
  tag: "0.45.2"
  pullPolicy: Never

driver:
  kind: modern_ebpf
  modernEbpf:
    # не privileged, а только нужные права: BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE
    leastPrivileged: true

falcoctl:
  artifact:
    install: {enabled: false}
    follow: {enabled: false}

collectors:
  containerEngine:
    enabled: true
    engines:
      docker: {enabled: false}
      podman: {enabled: false}
      containerd: {enabled: false}
      cri:
        enabled: true
        sockets: ["/run/k3s/containerd/containerd.sock"]
      lxc: {enabled: false}
      libvirt_lxc: {enabled: false}
      bpm: {enabled: false}
  kubernetes:
    enabled: false

falco:
  json_output: true
  json_include_output_property: true
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/rules.d
  # Тревоги в панель (http_output на machine-4:8090 с токеном). Адрес с токеном лежит не здесь и не
  # в ConfigMap чарта, а в Secret falco-panel-output: его создаёт deploy/panel/install.sh, токен в git
  # не попадает. Secret монтируется папкой /etc/falco/panel (mounts ниже), Falco дочитывает её после
  # falco.yaml; config.d остаётся первым, как в чарте. Пока панели нет, папка пустая (optional).
  config_files:
    - /etc/falco/config.d
    - /etc/falco/panel

mounts:
  volumes:
    - name: panel-output
      secret:
        secretName: falco-panel-output
        optional: true
        defaultMode: 0400
  volumeMounts:
    - name: panel-output
      mountPath: /etc/falco/panel
      readOnly: true

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

customRules:
  stand-rules.yaml: |-
    # Правила стенда: как ведёт себя под поиска. Сервис это один процесс python3 (uvicorn),
    # он ходит только в Qdrant (6333) и в фильтр Ollama на Маке (11434). Всё остальное в его
    # контейнере значит, что внутри человек или чужой код.
    - list: stand_shells
      items: [sh, bash, dash, ash, zsh, ksh]

    - macro: stand_search_container
      condition: (container.id != host and k8s.ns.name = "search")

    - rule: Stand shell in search pod
      desc: В контейнере сервиса поиска запущена командная оболочка. Сервису она не нужна.
      condition: spawned_process and stand_search_container and proc.name in (stand_shells)
      output: >
        Оболочка в поде поиска (pod=%k8s.pod.name proc=%proc.name parent=%proc.pname
        cmd=%proc.cmdline uid=%user.uid)
      priority: WARNING
      tags: [stand, shell]

    - rule: Stand unexpected process in search pod
      desc: >
        В поде поиска запущен процесс, которого у сервиса нет. Служебный runc init от kubectl exec
        не считаем: саму оболочку ловит правило выше.
      condition: >
        spawned_process and stand_search_container and not proc.name in (stand_shells)
        and not proc.pname = runc
        and (not proc.name startswith python or proc.pname in (stand_shells))
      output: >
        Чужой процесс в поде поиска (pod=%k8s.pod.name proc=%proc.name parent=%proc.pname
        cmd=%proc.cmdline uid=%user.uid)
      priority: WARNING
      tags: [stand, process]

    - rule: Stand Qdrant key read from shell
      desc: Ключ Qdrant читает процесс, запущенный из оболочки, а не сам сервис.
      condition: >
        open_read and stand_search_container and fd.name startswith /run/secrets/qdrant
        and proc.pname in (stand_shells)
      output: >
        Ключ Qdrant читают из оболочки (pod=%k8s.pod.name proc=%proc.cmdline file=%fd.name)
      priority: CRITICAL
      tags: [stand, credentials]

    - rule: Stand forbidden connection from search pod
      desc: >
        Под поиска соединяется не с Qdrant и не с фильтром Ollama (успешно или нет). В Falco 0.45
        событий входа в вызов нет, connect виден один раз, на выходе.
      condition: >
        evt.type = connect and stand_search_container
        and (fd.typechar = 4 or fd.typechar = 6) and not fd.sport in (6333, 11434)
        and fd.sip != "0.0.0.0" and not fd.snet in ("127.0.0.0/8")
      output: >
        Запрещённое соединение из пода поиска (pod=%k8s.pod.name proc=%proc.cmdline
        to=%fd.sip:%fd.sport res=%evt.res)
      priority: WARNING
      tags: [stand, network]

# Метрики для Prometheus на machine-4: счётчики сработавших правил и потерь событий ядра.
# Вебсервер Falco отдаёт их на 8765 (/metrics); снаружи NodePort 30765 и правило сети
# из deploy/monitoring/k8s.yaml пускают только machine-4. Свой Service чарта не нужен.
metrics:
  enabled: true
  rulesCountersEnabled: true
  kernelEventCountersEnabled: true
  resourceUtilizationEnabled: false
  stateCountersEnabled: false
  libbpfStatsEnabled: false
  pluginsMetricsEnabled: false
  kernelIterEventCountersEnabled: false
  service:
    create: false

# Исключения kube-linter (CI, job manifests). У сторожа они по устройству: он смотрит на всю машину.
controller:
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "Falco читает события ядра и /proc хоста; root, но с узким набором прав (leastPrivileged, без privileged)"
    ignore-check.kube-linter.io/sensitive-host-mounts: "/proc и /etc хоста нужны Falco для сведений о процессах и пользователях машины"
    ignore-check.kube-linter.io/no-read-only-root-fs: "корень только на чтение для Falco на стенде ещё не проверен"
    ignore-check.kube-linter.io/drop-net-raw-capability: "сырые сокеты Falco не нужны, но drop ALL вместе с leastPrivileged на стенде ещё не проверен"
