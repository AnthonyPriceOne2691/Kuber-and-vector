# Qdrant на стенде (чарт qdrant 1.20.2). Этап 1: один пир на machine-1.
# Образ только из комплекта: pullPolicy Never, в реестр кластер не ходит.
# Ключи (админский и только на чтение) лежат в Secret qdrant-keys, его создаёт install.sh.
replicaCount: 1

image:
  repository: docker.io/qdrant/qdrant
  tag: v1.20.2
  pullPolicy: Never

env:
  - name: QDRANT__TELEMETRY_DISABLED
    value: "true"

apiKey:
  valueFrom:
    secretKeyRef:
      name: qdrant-keys
      key: api-key

readOnlyApiKey:
  valueFrom:
    secretKeyRef:
      name: qdrant-keys
      key: read-only-api-key

persistence:
  size: 4Gi
  storageClassName: local-path

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 2Gi
